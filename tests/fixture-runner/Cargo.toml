[package]
name = "dovecote-migration-fixture-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[dependencies]
dovecote = { path = "../sibling-worktrees/carrier/crates/dovecote", version = "0.2.0" }
dovecote-sqlx-mysql = { path = "../sibling-worktrees/carrier/crates/dovecote-sqlx-mysql", version = "0.2.0" }
dovecote-sqlx-postgres = { path = "../sibling-worktrees/carrier/crates/dovecote-sqlx-postgres", version = "0.2.0" }
dovecote-sqlx-sqlite = { path = "../sibling-worktrees/carrier/crates/dovecote-sqlx-sqlite", version = "0.2.0" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "postgres",
  "mysql",
  "time",
] }
time = { version = "0.3.41", features = ["parsing", "formatting"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.18.1", features = ["v4"] }
